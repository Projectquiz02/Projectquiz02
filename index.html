<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomify 3D: Visualize Furniture in Your Space</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Arial", sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      background: #1e88e5;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1.1rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls div {
      display: flex;
      gap: 15px;
    }

    .controls button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: #42a5f5;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .controls button:hover {
      background: #1e88e5;
    }

    .controls select {
      padding: 10px;
      font-size: 1rem;
      border-radius: 10px;
      border: 2px solid #42a5f5;
    }

    .room {
      width: 100%;
      height: 500px;
      position: relative;
      background: #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      overflow: hidden;
      transform: perspective(1500px);
      transition: transform 0.5s ease;
    }

    .furniture {
      position: absolute;
      cursor: grab;
      transition: all 0.3s ease;
    }

    .furniture img {
      width: 100px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .furniture:active {
      cursor: grabbing;
    }

    .furniture:hover {
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      background: #f0f0f0;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .controls {
        flex-direction: column;
        align-items: center;
      }
      .room {
        height: 400px;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Roomify 3D: Visualize Furniture in Your Space</h1>
      <p>Drag and drop furniture into your room and design your dream space!</p>
    </header>

    <div class="controls">
      <div>
        <select id="furniture-category">
          <option value="chairs">Chairs</option>
          <option value="sofas">Sofas</option>
          <option value="tables">Tables</option>
        </select>
        <button id="load-furniture-btn">Load Furniture</button>
      </div>
      <div>
        <button id="save-btn">Save Layout</button>
        <button id="reset-btn">Reset Room</button>
      </div>
    </div>

    <div class="room" id="room"></div>

    <footer>
      Made with ❤️ by Roomify Team
    </footer>
  </div>

  <script>
    // Data for furniture images based on categories
    const furnitureData = {
      chairs: [
        "https://via.placeholder.com/100x100?text=Chair1",
        "https://via.placeholder.com/100x100?text=Chair2",
        "https://via.placeholder.com/100x100?text=Chair3"
      ],
      sofas: [
        "https://via.placeholder.com/100x100?text=Sofa1",
        "https://via.placeholder.com/100x100?text=Sofa2",
        "https://via.placeholder.com/100x100?text=Sofa3"
      ],
      tables: [
        "https://via.placeholder.com/100x100?text=Table1",
        "https://via.placeholder.com/100x100?text=Table2",
        "https://via.placeholder.com/100x100?text=Table3"
      ]
    };

    const room = document.getElementById('room');
    const loadFurnitureBtn = document.getElementById('load-furniture-btn');
    const resetBtn = document.getElementById('reset-btn');
    const saveBtn = document.getElementById('save-btn');
    const furnitureCategorySelect = document.getElementById('furniture-category');

    // Function to load furniture based on selected category
    loadFurnitureBtn.addEventListener('click', () => {
      const category = furnitureCategorySelect.value;
      const furnitureImages = furnitureData[category];
      room.innerHTML = '';

      furnitureImages.forEach(imgSrc => {
        const furniture = document.createElement('div');
        furniture.classList.add('furniture');
        furniture.innerHTML = `<img src="${imgSrc}" alt="${category}">`;
        furniture.style.top = `${Math.random() * 80 + 10}%`;
        furniture.style.left = `${Math.random() * 80 + 10}%`;
        room.appendChild(furniture);

        // Dragging functionality
        furniture.addEventListener('mousedown', (e) => {
          let offsetX = e.clientX - furniture.offsetLeft;
          let offsetY = e.clientY - furniture.offsetTop;

          const onMouseMove = (moveEvent) => {
            furniture.style.left = `${moveEvent.clientX - offsetX}px`;
            furniture.style.top = `${moveEvent.clientY - offsetY}px`;
          };

          document.addEventListener('mousemove', onMouseMove);

          document.addEventListener('mouseup', () => {
            document.removeEventListener('mousemove', onMouseMove);
          });
        });
      });
    });

    // Save the room layout to local storage
    saveBtn.addEventListener('click', () => {
      const furnitureData = [];
      document.querySelectorAll('.furniture').forEach(furniture => {
        furnitureData.push({
          src: furniture.querySelector('img').src,
          top: furniture.style.top,
          left: furniture.style.left
        });
      });
      localStorage.setItem('roomLayout', JSON.stringify(furnitureData));
      alert('Room layout saved!');
    });

    // Load saved room layout
    const loadSavedLayout = () => {
      const savedLayout = JSON.parse(localStorage.getItem('roomLayout'));
      if (savedLayout) {
        savedLayout.forEach(item => {
          const furniture = document.createElement('div');
          furniture.classList.add('furniture');
          furniture.innerHTML = `<img src="${item.src}" alt="Furniture">`;
          furniture.style.top = item.top;
          furniture.style.left = item.left;
          room.appendChild(furniture);
        });
      }
    };

    // Reset room
    resetBtn.addEventListener('click', () => {
      room.innerHTML = '';
      localStorage.removeItem('roomLayout');
    });

    // Load saved layout when the page is opened
    loadSavedLayout();
  </script>
</body>
</html>
