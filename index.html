<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomify: Visualize Furniture</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Arial", sans-serif;
      background: linear-gradient(135deg, #eceff1, #90caf9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #42a5f5, #1e88e5);
      color: white;
      text-align: center;
      padding: 15px 0;
      border-radius: 8px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      font-size: 1rem;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls div {
      display: flex;
      gap: 10px;
    }

    .controls button {
      padding: 10px 15px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background: #42a5f5;
      color: white;
      cursor: pointer;
      transition: all 0.3s;
    }

    .controls button:hover {
      background: #1e88e5;
    }

    .room {
      width: 100%;
      height: 500px;
      background: url('https://via.placeholder.com/800x500?text=Room') no-repeat center center / cover;
      position: relative;
      border: 2px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .furniture {
      position: absolute;
      cursor: grab;
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.3s;
    }

    .furniture img {
      width: 100px;
      height: auto;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .furniture:active {
      cursor: grabbing;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      background: #eceff1;
      border-radius: 8px;
    }

    @media screen and (max-width: 768px) {
      .controls {
        flex-direction: column;
        align-items: center;
      }

      .room {
        height: 400px;
      }

      .furniture img {
        width: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Roomify: Visualize Furniture in Your Space</h1>
      <p>Drag, drop, resize, and design your room!</p>
    </header>

    <div class="controls">
      <div>
        <button class="furniture-btn" data-item="chair">Add Chair</button>
        <button class="furniture-btn" data-item="table">Add Table</button>
        <button class="furniture-btn" data-item="sofa">Add Sofa</button>
      </div>
      <div>
        <button id="save-btn">Save Layout</button>
        <button id="reset-btn">Reset Room</button>
      </div>
    </div>

    <div class="room" id="room"></div>

    <footer>
      Made with ❤️ by Roomify Team
    </footer>
  </div>

  <script>
    const room = document.getElementById('room');
    const furnitureButtons = document.querySelectorAll('.furniture-btn');
    const saveBtn = document.getElementById('save-btn');
    const resetBtn = document.getElementById('reset-btn');
    let draggedItem = null;

    const furnitureImages = {
      chair: "https://via.placeholder.com/100?text=Chair",
      table: "https://via.placeholder.com/100?text=Table",
      sofa: "https://via.placeholder.com/100?text=Sofa",
    };

    // Add furniture to the room
    furnitureButtons.forEach(button => {
      button.addEventListener('click', () => {
        const furnitureType = button.getAttribute('data-item');
        const furniture = document.createElement('div');
        furniture.classList.add('furniture');
        furniture.innerHTML = `<img src="${furnitureImages[furnitureType]}" alt="${furnitureType}">`;
        furniture.style.top = "50%";
        furniture.style.left = "50%";
        room.appendChild(furniture);

        // Drag and Drop functionality
        furniture.addEventListener('mousedown', (e) => {
          draggedItem = furniture;
          draggedItem.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
          if (draggedItem) {
            const rect = room.getBoundingClientRect();
            draggedItem.style.top = `${e.clientY - rect.top - 50}px`;
            draggedItem.style.left = `${e.clientX - rect.left - 50}px`;
          }
        });

        document.addEventListener('mouseup', () => {
          if (draggedItem) draggedItem.style.cursor = 'grab';
          draggedItem = null;
        });
      });
    });

    // Save room layout
    saveBtn.addEventListener('click', () => {
      const furnitureData = [];
      document.querySelectorAll('.furniture').forEach(item => {
        furnitureData.push({
          type: item.querySelector('img').alt,
          top: item.style.top,
          left: item.style.left,
        });
      });
      localStorage.setItem('roomLayout', JSON.stringify(furnitureData));
      alert('Room layout saved!');
    });

    // Load room layout
    const loadRoomLayout = () => {
      const savedLayout = JSON.parse(localStorage.getItem('roomLayout'));
      if (savedLayout) {
        savedLayout.forEach(item => {
          const furniture = document.createElement('div');
          furniture.classList.add('furniture');
          furniture.innerHTML = `<img src="${furnitureImages[item.type]}" alt="${item.type}">`;
          furniture.style.top = item.top;
          furniture.style.left = item.left;
          room.appendChild(furniture);
        });
      }
    };

    // Reset the room
    resetBtn.addEventListener('click', () => {
      room.innerHTML = '';
      localStorage.removeItem('roomLayout');
    });

    // Initialize
    loadRoomLayout();
  </script>
</body>
</html>
