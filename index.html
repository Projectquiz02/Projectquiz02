<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Optition Chatbot</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Chatbot Button */
    #chatbot-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background-color: #0078d7;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    /* Chatbot Container */
    #chatbot {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 100%;
      max-width: 400px;
      height: 500px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    #chatbot-header {
      background-color: #0078d7;
      color: white;
      padding: 15px;
      font-size: 18px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatbot-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    #chatbot-input-container {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
      gap: 5px;
    }

    #chatbot-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #chatbot-send {
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 15px;
      cursor: pointer;
    }

    /* Chat Messages */
    #chatbot-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background-color: #0078d7;
      color: white;
    }

    .bot-message {
      align-self: flex-start;
      background-color: #f1f1f1;
      color: #333;
    }

    /* Dynamic Buttons */
    .dynamic-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .dynamic-button {
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .dynamic-button:hover {
      background-color: #005bb5;
    }

    /* Appointment Form */
    #appointment-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    #appointment-form input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #appointment-form button {
      padding: 10px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="chatbot-button" onclick="toggleChatbot()">💬</div>

<div id="chatbot">
  <div id="chatbot-header">
    JB Optition Assistant
    <button style="background: none; border: none; color: white; font-size: 18px;" onclick="toggleChatbot()">✖</button>
  </div>
  <div id="chatbot-body">
    <div id="chatbot-messages"></div>
    <div id="dynamic-buttons" class="dynamic-buttons">
      <button class="dynamic-button" onclick="handleOption('Store Hours')">Store Hours</button>
      <button class="dynamic-button" onclick="handleOption('Eye Tests')">Eye Tests</button>
      <button class="dynamic-button" onclick="handleOption('Book Appointment')">Book Appointment</button>
      <button class="dynamic-button" onclick="handleOption('Return Policy')">Return Policy</button>
    </div>
    <div id="appointment-form">
      <input type="text" id="user-name" placeholder="Enter your name">
      <input type="text" id="user-phone" placeholder="Enter your phone number">
      <input type="email" id="user-email" placeholder="Enter your email">
      <button onclick="submitAppointment()">Submit Appointment</button>
    </div>
  </div>
</div>

<script>
  function toggleChatbot() {
    const chatbot = document.getElementById("chatbot");
    chatbot.style.display = chatbot.style.display === "flex" ? "none" : "flex";
  }

  function handleOption(option) {
    const messages = document.getElementById("chatbot-messages");
    const buttons = document.getElementById("dynamic-buttons");
    const form = document.getElementById("appointment-form");

    // Clear buttons for dynamic flow
    buttons.style.display = "none";

    // Append user message
    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.textContent = option;
    messages.appendChild(userMessage);

    // Show bot response
    const botMessage = document.createElement("div");
    botMessage.className = "message bot-message";

    if (option === "Book Appointment") {
      botMessage.textContent = "Which store would you like to book an appointment for?";
      const storeButtons = `
        <button class="dynamic-button" onclick="selectStore('Store 1')">Store 1</button>
        <button class="dynamic-button" onclick="selectStore('Store 2')">Store 2</button>
      `;
      buttons.innerHTML = storeButtons;
      buttons.style.display = "flex";
    } else {
      const responses = {
        "Store Hours": "Our stores are open from 10 AM to 8 PM every day.",
        "Eye Tests": "Yes, we offer professional eye tests. Contact us to schedule.",
        "Return Policy": "You can return products within 30 days of purchase with proof.",
      };
      botMessage.textContent = responses[option];
    }

    messages.appendChild(botMessage);
  }

  function selectStore(store) {
    const messages = document.getElementById("chatbot-messages");
    const buttons = document.getElementById("dynamic-buttons");
    const form = document.getElementById("appointment-form");

    const userMessage = document.createElement("div");
    userMessage.className = "message user-message";
    userMessage.textContent = store;
    messages.appendChild(userMessage);

    const botMessage = document.createElement("div");
    botMessage.className = "message bot-message";
    botMessage.textContent = "Please fill out the form to complete your appointment booking.";
    messages.appendChild(botMessage);

    buttons.style.display = "none";
    form.style.display = "flex";
  }

  function submitAppointment() {
    const name = document.getElementById("user-name").value;
    const phone = document.getElementById("user-phone").value;
    const email = document.getElementById("user-email").value;

    if (name && phone && email) {
      alert("Appointment submitted successfully!");
      document.getElementById("appointment-form").style.display = "none";
    } else {
      alert("Please fill out all fields.");
    }
  }
</script>

</body>
</html>
