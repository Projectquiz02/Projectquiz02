<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha News 🗞️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 15px;
        }
        select, button {
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        .news-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px;
        }
        .news-card {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .news-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .news-card h3 {
            font-size: 18px;
            color: #333;
        }
        .news-card p {
            font-size: 14px;
            color: #555;
        }
        .news-card a {
            text-decoration: none;
            color: #4CAF50;
            font-weight: bold;
        }
        .no-news {
            text-align: center;
            font-size: 18px;
            color: #f44336;
        }
    </style>
</head>
<body>

<header>
    <h1>Maha News 🗞️</h1>
    <p>Latest News from Maharashtra</p>
</header>

<div style="text-align: center;">
    <select id="citySelect">
        <option value="Mumbai">Mumbai</option>
        <option value="Pune">Pune</option>
        <option value="Nagpur">Nagpur</option>
        <option value="Nashik">Nashik</option>
        <option value="Aurangabad">Aurangabad</option>
        <option value="Solapur">Solapur</option>
        <option value="Akola">Akola</option>
        <option value="Kolhapur">Kolhapur</option>
        <option value="Jalna">Jalna</option>
        <option value="Thane">Thane</option>
        <!-- Add more cities from Maharashtra here -->
    </select>
    <button onclick="fetchNews()">Get News</button>
</div>

<div id="newsContainer" class="news-container"></div>
<div id="noNewsMessage" class="no-news" style="display: none;">No news available for this city.</div>

<script>
    const apiKey = '8f345980-e63d-4452-95c4-248fc9c4466c'; // Your API key
    const apiUrl = 'https://newsapi.org/v2/everything'; // News API endpoint

    function fetchNews() {
        const city = document.getElementById('citySelect').value;
        const newsContainer = document.getElementById('newsContainer');
        const noNewsMessage = document.getElementById('noNewsMessage');
        
        // Clear previous news and hide the "No news" message
        newsContainer.innerHTML = '';
        noNewsMessage.style.display = 'none';

        const query = city + ' Maharashtra';  // Add Maharashtra to the query to focus news on the state

        // Construct the API URL
        const url = `${apiUrl}?q=${encodeURIComponent(query)}&apiKey=${apiKey}`;

        // Fetch the news from the API
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.articles && data.articles.length > 0) {
                    // If there are articles, display them
                    data.articles.forEach(article => {
                        const newsCard = document.createElement('div');
                        newsCard.classList.add('news-card');
                        
                        const newsImage = article.urlToImage ? `<img src="${article.urlToImage}" alt="news image">` : '';
                        const newsTitle = article.title ? `<h3>${article.title}</h3>` : '';
                        const newsDescription = article.description ? `<p>${article.description}</p>` : '';
                        const newsLink = article.url ? `<a href="${article.url}" target="_blank">Read more</a>` : '';

                        newsCard.innerHTML = `
                            ${newsImage}
                            ${newsTitle}
                            ${newsDescription}
                            ${newsLink}
                        `;
                        newsContainer.appendChild(newsCard);
                    });
                } else {
                    // If no news is available, show the "No news" message
                    noNewsMessage.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error fetching the news:', error);
                noNewsMessage.style.display = 'block'; // Display the error message
                noNewsMessage.innerText = 'Failed to fetch news. Please try again later.';
            });
    }
</script>

</body>
</html>
