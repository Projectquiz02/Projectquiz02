<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Optition Chatbot</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Chatbot Button */
    #chatbot-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background-color: #0078d7;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    /* Chatbot Container */
    #chatbot {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 600px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      display: none;
      flex-direction: column;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    #chatbot-header {
      background-color: #0078d7;
      color: white;
      padding: 15px;
      font-size: 18px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatbot-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    #chatbot-input-container {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
      gap: 5px;
    }

    #chatbot-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #chatbot-send {
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 15px;
      cursor: pointer;
    }

    /* Chat Messages */
    #chatbot-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background-color: #0078d7;
      color: white;
    }

    .bot-message {
      align-self: flex-start;
      background-color: #f1f1f1;
      color: #333;
    }

    /* Fallback Form */
    #fallback-form {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    #fallback-form input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #fallback-form button {
      padding: 10px;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Quick Buttons */
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .quick-button {
      background-color: #0078d7;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .quick-button:hover {
      background-color: #005bb5;
    }
  </style>
</head>
<body>

<div id="chatbot-button" onclick="toggleChatbot()">💬</div>

<div id="chatbot">
  <div id="chatbot-header">
    JB Optition Assistant
    <button style="background: none; border: none; color: white; font-size: 18px;" onclick="toggleChatbot()">✖</button>
  </div>
  <div id="chatbot-body">
    <div id="chatbot-messages"></div>
    <div class="quick-buttons">
      <button class="quick-button" onclick="quickReply('What are your store hours?')">Store Hours</button>
      <button class="quick-button" onclick="quickReply('Do you provide eye tests?')">Eye Tests</button>
      <button class="quick-button" onclick="quickReply('How can I book an appointment?')">Book Appointment</button>
      <button class="quick-button" onclick="quickReply('What is your return policy?')">Return Policy</button>
    </div>
    <div id="fallback-form">
      <input type="text" id="user-whatsapp" placeholder="Enter your WhatsApp number">
      <input type="email" id="user-email" placeholder="Enter your Email">
      <button onclick="submitForm()">Submit</button>
    </div>
  </div>
  <div id="chatbot-input-container">
    <input type="text" id="chatbot-input" placeholder="Type your query...">
    <button id="chatbot-send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  function toggleChatbot() {
    const chatbot = document.getElementById("chatbot");
    chatbot.style.display = chatbot.style.display === "flex" ? "none" : "flex";
  }

  function quickReply(message) {
    document.getElementById("chatbot-input").value = message;
    sendMessage();
  }

  function sendMessage() {
    const inputField = document.getElementById("chatbot-input");
    const message = inputField.value.trim();

    if (!message) return;

    addMessage(message, "user-message");
    inputField.value = "";

    setTimeout(() => {
      const response = getChatbotResponse(message);
      addMessage(response.message, "bot-message");

      if (response.showForm) {
        document.getElementById("fallback-form").style.display = "flex";
      }
    }, 500);
  }

  function addMessage(content, className) {
    const messages = document.getElementById("chatbot-messages");
    const messageElement = document.createElement("div");
    messageElement.className = `message ${className}`;
    messageElement.textContent = content;
    messages.appendChild(messageElement);
    messages.scrollTop = messages.scrollHeight;
  }

  function getChatbotResponse(message) {
    const responses = {
      "what are your store hours?": "Our stores are open from 10 AM to 8 PM every day.",
      "do you provide eye tests?": "Yes, we offer professional eye tests. Contact us to schedule.",
      "how can i book an appointment?": "Please let us know which store you'd like to book an appointment at.",
      "what is your return policy?": "You can return products within 30 days of purchase with proof."
    };

    const normalizedMessage = message.toLowerCase();
    const response = responses[normalizedMessage];

    if (response) {
      return { message: response, showForm: false };
    } else {
      return {
        message: "I couldn't find an answer to that. Please provide your WhatsApp number and email so we can assist you further.",
        showForm: true
      };
    }
  }

  function submitForm() {
    const whatsapp = document.getElementById("user-whatsapp").value;
    const email = document.getElementById("user-email").value;

    if (whatsapp && email) {
      alert(`Thank you! Our team will contact you at ${whatsapp} or ${email}.`);
      document.getElementById("fallback-form").style.display = "none";
    } else {
      alert("Please fill in both fields.");
    }
  }
</script>

</body>
</html>
